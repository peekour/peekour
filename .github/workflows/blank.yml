name: Download YouTube Homepage

on:
  workflow_dispatch: # این یعنی می‌تونی دستی اجراش کنی

jobs:
  download:
    runs-on: ubuntu-latest # از یک ماشین مجازی اوبونتو استفاده می‌کنه
    steps:
      - name: Checkout code # این مرحله کد ریپازیتوری رو در دسترس قرار میده (اگر لازم باشه)
        uses: actions/checkout@v4 # آخرین نسخه checkout

      - name: Fetch YouTube Homepage HTML
        run: |
          URL="https://www.youtube.com" # آدرس یوتیوب
          # از curl برای دانلود محتوا استفاده می‌کنیم و در فایلی به نام youtube_homepage.html ذخیره می‌کنیم
          curl -o youtube_homepage.html $URL
          echo "YouTube homepage downloaded to youtube_homepage.html"

      - name: Upload HTML file as artifact
        # از آخرین نسخه stable اکشن upload-artifact استفاده می‌کنیم
        uses: actions/upload-artifact@v4 # این همان نسخه 4 است که با Node.js 24 سازگار است
        with:
          name: downloaded-youtube-homepage # نام artifact که در گیت‌هاب نمایش داده میشه
          path: youtube_homepage.html     # فایلی که در مرحله قبل دانلود شد
          retention-days: 5             # فایل artifact به مدت 5 روز نگهداری میشه (اختیاری)
