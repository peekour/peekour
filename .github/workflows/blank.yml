name: Download YouTube Homepage

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      # این متغیر محیطی به runner میگه که از Node.js 24 استفاده کنه
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # اینجا هم checkout ممکنه Node.js 20 استفاده کنه، پس بهتره اینم آپدیت بشه

      - name: Fetch YouTube Homepage HTML
        run: |
          URL="https://www.youtube.com"
          curl -o youtube_homepage.html $URL
          echo "YouTube homepage downloaded to youtube_homepage.html"

      - name: Upload HTML file as artifact
        uses: actions/upload-artifact@v4 # همچنان v4، اما با FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 باید درست کار کنه
        with:
          name: downloaded-youtube-homepage
          path: youtube_homepage.html
          retention-days: 5
