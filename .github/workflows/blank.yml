name: Test File Download from GitHub

on:
  workflow_dispatch: # قابلیت اجرا دستی

jobs:
  test_download:
    runs-on: ubuntu-latest # استفاده از آخرین ماشین مجازی اوبونتو
    steps:
      - name: Create a simple text file
        run: |
          echo "This is a test file content." > test_file.txt
          echo "File 'test_file.txt' created."

      - name: Upload test file as artifact
        uses: actions/upload-artifact@v4 # استفاده از نسخه 4 اکشن upload-artifact
        with:
          name: test-artifact # نام artifact
          path: test_file.txt   # مسیری که فایل ساخته شده
          retention-days: 1     # فایل برای 1 روز نگهداری میشه

      - name: Confirm artifact upload (optional)
        run: echo "Artifact 'test-artifact' should now be available in the Actions tab."
